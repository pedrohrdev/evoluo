# Configuração do Supabase CLI para desenvolvimento local (`supabase start`)
# e para aplicar as migrations deste diretório (`supabase db push` /
# `supabase migration up`) contra o projeto remoto depois de `supabase link`.
#
# project_id é só o identificador local usado pelo CLI para nomear os
# containers do `supabase start` — não precisa bater com o project ref do
# Supabase remoto (esse vem do `supabase link --project-ref ...`).
project_id = "evoluo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
